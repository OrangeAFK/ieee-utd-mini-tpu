name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: verilator --version
      - run: python3 tb/run.py lint

  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: python3 tb/run.py sim
      - name: Shared component seed matrix and expected failures
        run: python3 tb/test_shared.py --skip-build
      - name: Regression harness verdict checks
        run: python3 -m unittest discover -s tb -p test_regression_harness.py -v

  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r model/requirements.txt
      - run: pytest model

